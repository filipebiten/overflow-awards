<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Overflow Awards — TalkFlow 03 — Rede Flow</title>

<style>
:root{
  --preto:#0A0A0A;
  --preto-suave:#161616;
  --off-white:#EBE8E0;
  --teal:#186678;
  --teal-claro:#2589A0;
  --teal-escuro:#0F4856;
  --cinza-claro:#D8D4CA;
  --ease:cubic-bezier(.32,.72,0,1);
  --font-display:'Bebas Neue',Impact,Oswald,sans-serif;
  --font-body:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--preto);color:var(--off-white);font-family:var(--font-body);overflow-x:hidden;}
#app{position:relative;min-height:100vh;}
button,input{font-family:var(--font-body);}
a{color:var(--teal-claro);}

.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-waves{opacity:.07;background-repeat:no-repeat,no-repeat;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><g fill='none' stroke='%232589A0' stroke-width='5'><circle cx='450' cy='450' r='90'/><circle cx='450' cy='450' r='180'/><circle cx='450' cy='450' r='270'/><circle cx='450' cy='450' r='360'/><circle cx='450' cy='450' r='450'/></g></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><g fill='none' stroke='%23186678' stroke-width='4'><circle cx='300' cy='300' r='60'/><circle cx='300' cy='300' r='130'/><circle cx='300' cy='300' r='200'/><circle cx='300' cy='300' r='270'/></g></svg>");
  background-position:right -220px bottom -220px, left -160px top -160px;
  background-size:900px 900px, 600px 600px;
}
.bg-grain{opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.display{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-0.01em;}
.display-huge{font-size:clamp(3.5rem,13vw,11rem);line-height:.94;}
.display-lg{font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;}
.display-md{font-size:clamp(1.4rem,4vw,2.6rem);line-height:1.05;}
.accent{color:var(--teal-claro);}

.btn{font-weight:700;padding:16px 30px;border-radius:999px;border:2px solid transparent;cursor:pointer;font-size:1.05rem;background:transparent;color:var(--off-white);transition:transform .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease),opacity .25s var(--ease);}
.btn-primary{background:var(--teal);}
.btn-primary:hover{background:var(--teal-claro);transform:translateY(-2px);}
.btn-outline{border-color:var(--cinza-claro);}
.btn-outline:hover{border-color:var(--teal-claro);color:var(--teal-claro);}
.btn-ghost{border:none;color:var(--cinza-claro);padding:8px 14px;font-size:.9rem;}
.btn-ghost:hover{color:var(--off-white);}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.btn-sm{padding:8px 16px;font-size:.85rem;border-radius:999px;}
.btn-block{width:100%;}

.card{background:var(--preto-suave);border-radius:18px;padding:18px;border:1px solid rgba(216,212,202,.10);}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;border:1px solid var(--teal-claro);color:var(--teal-claro);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}

input[type=text]{background:var(--preto-suave);border:1px solid var(--cinza-claro);color:var(--off-white);border-radius:12px;padding:16px 18px;font-size:1.2rem;width:100%;}
input[type=text]:focus{outline:none;border-color:var(--teal-claro);}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--preto-suave);border-radius:10px;}

/* ---- login / porta de vidro admin ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
.login-card{background:var(--preto-suave);border:1px solid rgba(216,212,202,.12);border-radius:18px;padding:34px 28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .4s var(--ease);}
.login-title{font-family:var(--font-display);text-transform:uppercase;font-size:2rem;line-height:1;}
.login-sub{color:var(--cinza-claro);font-size:.9rem;margin-top:-8px;margin-bottom:6px;}
.login-input{background:var(--preto);border:1px solid var(--cinza-claro);color:var(--off-white);border-radius:12px;padding:14px 16px;font-size:1.05rem;width:100%;}
.login-input:focus{outline:none;border-color:var(--teal-claro);}
.login-erro{color:#ff8b8b;font-size:.88rem;}
.login-back{display:inline-block;text-align:center;margin-top:4px;font-size:.88rem;color:var(--cinza-claro);text-decoration:none;}
.login-back:hover{color:var(--teal-claro);}
.admin-bar{display:flex;align-items:center;justify-content:flex-end;gap:12px;max-width:1100px;margin:0 auto;padding:14px 24px 0;position:relative;z-index:2;}
.admin-tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-claro);border:1px solid var(--teal-claro);border-radius:999px;padding:3px 12px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(.55) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.fade-up{animation:fadeUp .4s var(--ease);}
.pop-in{animation:popIn .5s var(--ease);}
.pulse{animation:pulse 1.8s ease-in-out infinite;}

/* ---- landing ---- */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px;position:relative;z-index:1;}
.landing img.logo{width:min(60vw,220px);}
.landing .buttons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}

/* ---- votar ---- */

.progress-track{width:100%;height:6px;border-radius:999px;background:rgba(216,212,202,.12);overflow:hidden;margin-bottom:auto;}
.progress-fill{height:100%;background:var(--teal-claro);border-radius:999px;transition:transform .5s var(--ease);transform-origin:left;}
.progress-label{font-size:.8rem;color:var(--cinza-claro);text-align:right;margin-top:8px;letter-spacing:.04em;}
.votar-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;width:100%;max-width:560px;margin:0 auto;}
.premio-nome{font-family:var(--font-display);font-size:clamp(2.4rem,9vw,4rem);line-height:1.02;}
.premio-explicacao{color:var(--cinza-claro);font-size:clamp(1rem,2.6vw,1.2rem);margin-top:-4px;}
.campo-wrap{width:100%;position:relative;}
.sugestoes{display:flex;flex-direction:column;gap:8px;margin-top:14px;width:100%;}
.sugestao-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--preto-suave);border:1px solid rgba(216,212,202,.14);border-radius:12px;padding:12px 16px;color:var(--off-white);cursor:pointer;font-size:1.05rem;transition:border-color .2s var(--ease),background .2s var(--ease);}
.sugestao-btn:hover,.sugestao-btn:focus{border-color:var(--teal-claro);background:rgba(37,137,160,.12);}
.sugestao-btn b{color:var(--teal-claro);font-family:var(--font-display);font-size:.95rem;flex-shrink:0;}
.nudge{background:rgba(24,102,120,.18);border:1px solid var(--teal-claro);border-radius:12px;padding:14px 16px;font-size:.95rem;display:flex;flex-direction:column;gap:10px;}
.nudge .row{display:flex;gap:10px;flex-wrap:wrap;}
.votar-actions{display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap;}
.votar-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}

/* ---- resultado ---- */
.resultado{min-height:100vh;padding:28px 24px 60px;position:relative;z-index:1;max-width:1100px;margin:0 auto;}
.resultado-header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px;}
.resultado-title{font-family:var(--font-display);font-size:2.2rem;}
.resultado-stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--cinza-claro);font-size:.95rem;}
.resultado-stats b{color:var(--teal-claro);font-family:var(--font-display);font-size:1.1rem;}
.categoria-card{margin-bottom:16px;}
.categoria-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.categoria-head .premio-nome-sm{font-family:var(--font-display);font-size:1.4rem;}
.categoria-head .meta{color:var(--cinza-claro);font-size:.85rem;}
.rank-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(216,212,202,.08);}
.rank-row:first-child{border-top:none;}
.rank-pos{font-family:var(--font-display);font-size:1.1rem;color:var(--cinza-claro);width:26px;flex-shrink:0;}
.rank-row.first .rank-pos{color:var(--teal-claro);}
.rank-nome{flex:1;font-weight:600;}
.rank-row.first .rank-nome{color:var(--teal-claro);font-family:var(--font-display);font-size:1.15rem;}
.rank-votos{font-size:.85rem;color:var(--cinza-claro);flex-shrink:0;}
.rank-tools{display:flex;gap:6px;flex-shrink:0;}
.rank-tools select{background:var(--preto-suave);color:var(--off-white);border:1px solid rgba(216,212,202,.2);border-radius:8px;font-size:.75rem;padding:4px 6px;}
.icon-btn{background:none;border:none;color:var(--cinza-claro);cursor:pointer;font-size:.9rem;padding:2px 6px;}
.icon-btn:hover{color:var(--teal-claro);}
.empty-msg{color:var(--cinza-claro);font-size:.9rem;padding:10px 0;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.6';
import { useState, useEffect, useRef, useCallback, useMemo } from 'https://esm.sh/preact@10.19.6/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
import { getDatabase, ref as dbRef, set, update, remove, onValue, get } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js';

const html = htm.bind(h);
const LOGO_URL = 'https://flow.1b.org.br/wp-content/uploads/2026/08/logo-flow-2026.png';
const EVENTO_NOME = 'OVERFLOW AWARDS 2026';

/* =========================================================
   CATEGORIAS — editar aqui
   ========================================================= */
const CATEGORIAS = [
  { id: 1, premio: 'Jovem Êutico', explicacao: 'Quem mais dormiu (Êutico cochilou e caiu da janela ouvindo Paulo pregar — Atos 20)' },
  { id: 2, premio: 'Conde Drácula', explicacao: 'Quem menos dormiu' },
  { id: 3, premio: 'Irmão/Irmã Unção', explicacao: 'O mais crente' },
  { id: 4, premio: 'Buraco Negro', explicacao: 'Quem mais comeu' },
  { id: 5, premio: 'Fardo Pesado', explicacao: 'Quem mais levou bagagem' },
  { id: 6, premio: 'Rubinho Barrichello', explicacao: 'Quem mais se atrasou' },
  { id: 7, premio: 'Liminha', explicacao: 'Quem mais animou a galera' },
  { id: 8, premio: 'O Matador de Gigantes', explicacao: 'Atleta do retiro' },
  { id: 9, premio: 'Miss Chapinha & Mister Espelho', explicacao: 'Os mais arrumados' },
  { id: 10, premio: 'Drogasil', explicacao: 'Quem mais levou remédio' },
  { id: 11, premio: 'Cascão/Cascuda', explicacao: 'Quem menos tomou banho' },
  { id: 12, premio: 'O Mais Mídias', explicacao: 'Quem mais tirou foto, gravou e postou' },
  { id: 13, premio: 'Mimimi', explicacao: 'O mais reclamão' },
  { id: 14, premio: 'Sola Scriptura', explicacao: 'Quem mais sabia de Bíblia' },
  { id: 15, premio: 'Servo Sofredor', explicacao: 'Quem mais serviu, trabalhou e ajudou' },
];

/* =========================================================
   SINCRONIZAÇÃO — Firebase Realtime Database.
   Mesmo projeto dos apps TalkFlow, path próprio. ?teste=1 usa
   um namespace separado pra não sujar os dados reais.
   ========================================================= */
const firebaseConfig = {
  apiKey: 'AIzaSyAKN8mRoXydV52eF1QZYNgJ_C0VFQPVTnM',
  authDomain: 'talkflow-dba50.firebaseapp.com',
  databaseURL: 'https://talkflow-dba50-default-rtdb.firebaseio.com',
  projectId: 'talkflow-dba50',
  storageBucket: 'talkflow-dba50.firebasestorage.app',
  messagingSenderId: '388105576650',
  appId: '1:388105576650:web:dc25b4d124d18809499433',
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const isTeste = new URLSearchParams(location.search).get('teste') === '1';
const basePath = `talkflow/overflowawards/${isTeste ? 'teste' : 'real'}`;
const pathNomes = (catId) => `${basePath}/nomes/${catId}`;
const pathVotos = (catId) => `${basePath}/votos/${catId}`;
const pathRespostas = (voterId) => `${basePath}/respostas/${voterId}`;
const pathFinalizados = `${basePath}/finalizados`;

function subscribe(path, handler) {
  return onValue(dbRef(db, path), (snap) => handler(snap.exists() ? snap.val() : null));
}
async function fetchOnce(path) {
  const snap = await get(dbRef(db, path));
  return snap.exists() ? snap.val() : null;
}

/* =========================================================
   UTILS — normalização de nome, distância de edição, voterId
   ========================================================= */
function normalizeName(raw) {
  return raw.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const row = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    let prevDiag = row[0];
    row[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = row[j];
      row[j] = a[i - 1] === b[j - 1] ? prevDiag : 1 + Math.min(prevDiag, row[j], row[j - 1]);
      prevDiag = tmp;
    }
  }
  return row[n];
}
function getVoterId() {
  const KEY = 'overflowAwardsVoterId';
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(KEY, id);
  }
  return id;
}
function rankingFromNomesVotos(nomes, votos) {
  const nomesObj = nomes || {};
  const votosObj = votos || {};
  return Object.keys(nomesObj).map((key) => ({
    key,
    nome: nomesObj[key],
    votos: Object.keys(votosObj[key] || {}).length,
  })).sort((a, b) => b.votos - a.votos);
}
function downloadJson(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* =========================================================
   LANDING
   ========================================================= */
function Landing() {
  return html`
    <div class="landing">
      <img class="logo" src=${LOGO_URL} alt="Flow" />
      <div>
        <div class="display display-huge">Overflow<br/>Awards</div>
        <p style="color:var(--cinza-claro);max-width:480px;margin:8px auto 0;">
          Votação da premiação do retiro. Rede Flow.
        </p>
      </div>
      <div class="buttons">
        <a class="btn btn-primary" href="?view=votar">Votar</a>
        <a class="btn btn-outline" href="?view=resultado">Acompanhar resultado</a>
      </div>
    </div>
  `;
}

/* =========================================================
   VOTAR
   ========================================================= */
function useCategoriaSync(catId, active) {
  const [nomes, setNomes] = useState(null);
  const [votos, setVotos] = useState(null);
  useEffect(() => {
    if (!active) return;
    setNomes(null); setVotos(null);
    const u1 = subscribe(pathNomes(catId), setNomes);
    const u2 = subscribe(pathVotos(catId), setVotos);
    return () => { u1(); u2(); };
  }, [catId, active]);
  return { nomes, votos };
}

function VotarCategoria({ categoria, voterId, respostaAtual, onAvancar, onVoltar, indexAtual, total }) {
  const { nomes, votos } = useCategoriaSync(categoria.id, true);
  const [texto, setTexto] = useState('');
  const [nudge, setNudge] = useState(null); // { key, nome, votos }
  const inputRef = useRef(null);
  const prefillDone = useRef(false);

  useEffect(() => {
    prefillDone.current = !(respostaAtual && respostaAtual !== 'skip');
    setTexto('');
    setNudge(null);
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
  }, [categoria.id]);

  // os nomes chegam do Firebase de forma assíncrona (às vezes depois deste
  // componente já ter montado) — só preenche o campo quando o nome canônico
  // da resposta atual chegar, e só na primeira vez (não sobrescreve o que a
  // pessoa está digitando quando outros votos chegam ao vivo).
  useEffect(() => {
    if (prefillDone.current) return;
    if (nomes && nomes[respostaAtual]) {
      setTexto(nomes[respostaAtual]);
      prefillDone.current = true;
    }
  }, [nomes, respostaAtual]);

  const ranking = useMemo(() => rankingFromNomesVotos(nomes, votos), [nomes, votos]);
  const sugestoes = useMemo(() => {
    const q = normalizeName(texto);
    if (!q) return ranking.slice(0, 6);
    return ranking.filter((r) => r.key.includes(q)).slice(0, 6);
  }, [ranking, texto]);

  function salvarVoto(key, nomeCanonico) {
    const updates = {};
    // se já tinha votado em outro nome nesta categoria, remove o voto antigo
    if (respostaAtual && respostaAtual !== 'skip' && respostaAtual !== key) {
      updates[`${pathVotos(categoria.id)}/${respostaAtual}/${voterId}`] = null;
    }
    if (!nomes || !nomes[key]) updates[`${pathNomes(categoria.id)}/${key}`] = nomeCanonico;
    updates[`${pathVotos(categoria.id)}/${key}/${voterId}`] = true;
    updates[pathRespostas(voterId) + `/${categoria.id}`] = key;
    update(dbRef(db), updates);
    onAvancar();
  }

  function confirmarTextoLivre() {
    const key = normalizeName(texto);
    if (!key) return;
    if (nomes && nomes[key]) { salvarVoto(key, nomes[key]); return; }
    let best = null;
    for (const r of ranking) {
      const dist = levenshtein(key, r.key);
      const limite = Math.min(3, Math.max(1, Math.floor(r.key.length * 0.25)));
      if (dist > 0 && dist <= limite && (!best || dist < best.dist)) best = { ...r, dist };
    }
    if (best) { setNudge(best); return; }
    salvarVoto(key, texto.trim());
  }

  function pular() {
    const updates = {};
    if (respostaAtual && respostaAtual !== 'skip') {
      updates[`${pathVotos(categoria.id)}/${respostaAtual}/${voterId}`] = null;
    }
    updates[pathRespostas(voterId) + `/${categoria.id}`] = 'skip';
    update(dbRef(db), updates);
    onAvancar();
  }

  return html`
    <div class="votar">
      <div>
        <div class="progress-track"><div class="progress-fill" style=${{ transform: `scaleX(${(indexAtual + 1) / total})` }}></div></div>
        <div class="progress-label">${indexAtual + 1} de ${total}</div>
      </div>
      <div class="votar-body fade-up" key=${categoria.id}>
        <div>
          <div class="premio-nome">${categoria.premio}</div>
          <div class="premio-explicacao">${categoria.explicacao}</div>
        </div>
        <div class="campo-wrap">
          <input ref=${inputRef} type="text" placeholder="Digite um nome…" value=${texto}
            onInput=${(e) => { setTexto(e.target.value); setNudge(null); }}
            onKeyDown=${(e) => { if (e.key === 'Enter') confirmarTextoLivre(); }} />
          ${nudge ? html`
            <div class="nudge">
              <div>Nome parecido já votado: <b class="accent">${nudge.nome}</b> (${nudge.votos} ${nudge.votos === 1 ? 'voto' : 'votos'}). É essa pessoa?</div>
              <div class="row">
                <button class="btn btn-primary btn-sm" onClick=${() => salvarVoto(nudge.key, nudge.nome)}>Sim, é essa pessoa</button>
                <button class="btn btn-outline btn-sm" onClick=${() => { setNudge(null); salvarVoto(normalizeName(texto), texto.trim()); }}>Não, é outra pessoa</button>
              </div>
            </div>
          ` : sugestoes.length ? html`
            <div class="sugestoes">
              ${sugestoes.map((s) => html`
                <button key=${s.key} class="sugestao-btn" onClick=${() => salvarVoto(s.key, s.nome)}>

function VotarView() {
  const voterId = useMemo(() => getVoterId(), []);
  const [respostas, setRespostas] = useState(null);
  const [finalizado, setFinalizado] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [index, setIndex] = useState(0);
  const [comecou, setComecou] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const [resp, fin] = await Promise.all([
        fetchOnce(pathRespostas(voterId)),
        fetchOnce(`${pathFinalizados}/${voterId}`),
      ]);
      if (cancelled) return;
      setRespostas(resp || {});
      if (resp && Object.keys(resp).length) setComecou(true);
      if (fin) { setFinalizado(true); setLoaded(true); return; }
      let first = CATEGORIAS.length - 1;
      for (let i = 0; i < CATEGORIAS.length; i++) {
        if (!(resp && resp[CATEGORIAS[i].id])) { first = i; break; }
      }
      setIndex(first);
      setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, [voterId]);

  function finalizar() {
    set(dbRef(db, `${pathFinalizados}/${voterId}`), true);
    setFinalizado(true);
  }
  function avancar(catId, key) {
    setRespostas((prev) => ({ ...(prev || {}), [catId]: key }));
    if (index >= CATEGORIAS.length - 1) finalizar();
    else setIndex(index + 1);
  }

  if (!loaded) return html`<div class="votar"><div class="votar-body"><div class="pulse">Carregando…</div></div></div>`;
  if (finalizado) return html`<${VotarEncerrado} />`;
  if (!comecou) return html`<${VotarIntro} onComecar=${() => setComecou(true)} total=${CATEGORIAS.length} />`;

  const categoria = CATEGORIAS[index];
  return html`<${VotarCategoria}
    categoria=${categoria}
    voterId=${voterId}
    respostaAtual=${respostas ? respostas[categoria.id] : null}
    indexAtual=${index}
    total=${CATEGORIAS.length}
    onVoltar=${() => { if (index === 0) setComecou(false); else setIndex(index - 1); }}
    onAvancar=${(key) => avancar(categoria.id, key)}
  />`;
}

/* =========================================================
   RESULTADO (privado)
   ========================================================= */
function useResultadoSync() {
  const [nomes, setNomes] = useState({});
  const [votos, setVotos] = useState({});
  const [respostas, setRespostas] = useState({});
  useEffect(() => {
    const u1 = subscribe(`${basePath}/nomes`, (v) => setNomes(v || {}));
    const u2 = subscribe(`${basePath}/votos`, (v) => setVotos(v || {}));
    const u3 = subscribe(`${basePath}/respostas`, (v) => setRespostas(v || {}));
    return () => { u1(); u2(); u3(); };
  }, []);
  return { nomes, votos, respostas };
}

function CategoriaResultado({ categoria, nomes, votos }) {
  const ranking = useMemo(() => rankingFromNomesVotos(nomes, votos), [nomes, votos]);
  const votantes = useMemo(() => {
    const ids = new Set();
    Object.values(votos || {}).forEach((obj) => Object.keys(obj || {}).forEach((id) => ids.add(id)));
    return ids.size;
  }, [votos]);
  const [mergeFrom, setMergeFrom] = useState('');

  function removerUmVoto(key) {
    const voterIds = Object.keys((votos || {})[key] || {});
    if (!voterIds.length) return;
    remove(dbRef(db, `${pathVotos(categoria.id)}/${key}/${voterIds[0]}`));
  }
  function excluirNome(key) {
    if (!confirm(`Excluir "${nomes[key]}" e todos os votos dele nesta categoria?`)) return;
    remove(dbRef(db, `${pathVotos(categoria.id)}/${key}`));
    remove(dbRef(db, `${pathNomes(categoria.id)}/${key}`));
  }
  function fundir(fromKey, toKey) {
    if (!fromKey || !toKey || fromKey === toKey) return;
    const fromVoters = (votos || {})[fromKey] || {};
    const updates = {};
    Object.keys(fromVoters).forEach((voterId) => { updates[`${pathVotos(categoria.id)}/${toKey}/${voterId}`] = true; });
    update(dbRef(db), updates).then(() => {
      remove(dbRef(db, `${pathVotos(categoria.id)}/${fromKey}`));
      remove(dbRef(db, `${pathNomes(categoria.id)}/${fromKey}`));
    });
    setMergeFrom('');
  }

  return html`
    <div class="card categoria-card">
      <div class="categoria-head">
        <span class="premio-nome-sm">${categoria.premio}</span>
        <span class="meta">${categoria.explicacao} · ${votantes} ${votantes === 1 ? 'votante' : 'votantes'}</span>
      </div>
      ${ranking.length === 0 ? html`<div class="empty-msg">Nenhum voto ainda.</div>` : ranking.map((r, i) => html`
        <div class="rank-row ${i === 0 ? 'first' : ''}" key=${r.key}>
          <span class="rank-pos">${i + 1}º</span>
          <span class="rank-nome">${r.nome}</span>
          <span class="rank-votos">${r.votos} ${r.votos === 1 ? 'voto' : 'votos'}</span>
          <span class="rank-tools">
            <select onChange=${(e) => { if (e.target.value) { fundir(r.key, e.target.value); e.target.value = ''; } }}>
              <option value="">fundir com…</option>
              ${ranking.filter((o) => o.key !== r.key).map((o) => html`<option key=${o.key} value=${o.key}>${o.nome}</option>`)}
            </select>
            <button class="icon-btn" title="Remover um voto" onClick=${() => removerUmVoto(r.key)}>-1</button>
            <button class="icon-btn" title="Excluir nome inteiro" onClick=${() => excluirNome(r.key)}>✕</button>
          </span>
        </div>
      `)}
    </div>
  `;
}

function ResultadoView() {
  const { nomes, votos, respostas } = useResultadoSync();
  const totalVotantes = Object.keys(respostas || {}).length;

  function exportar() {
    const categorias = CATEGORIAS.map((c) => {
      const ranking = rankingFromNomesVotos(nomes[c.id], votos[c.id]);
      return {
        id: c.id,
        premio: c.premio,
        explicacao: c.explicacao,
        vencedor: ranking[0] ? ranking[0].nome : '',
        votos: ranking[0] ? ranking[0].votos : 0,
        ranking: ranking.map((r) => ({ nome: r.nome, votos: r.votos })),
      };
    });
    downloadJson(`overflow-awards-resultado${isTeste ? '-teste' : ''}.json`, {
      evento: EVENTO_NOME,
      geradoEm: new Date().toISOString(),
      totalVotantes,
      categorias,
    });
  }
  function limparTudo() {
    if (!confirm('Limpar TODOS os dados de teste desta votação?')) return;
    remove(dbRef(db, basePath));
  }

  return html`
    <div class="resultado">
      <div class="resultado-header">
        <div>
          <div class="resultado-title">Overflow Awards <span class="accent">· resultado</span></div>
          ${isTeste ? html`<span class="pill">MODO TESTE</span>` : ''}
        </div>
        <div class="toolbar">
          <div class="resultado-stats"><span><b>${totalVotantes}</b> votantes</span></div>
          <button class="btn btn-primary btn-sm" onClick=${exportar}>Exportar JSON</button>
          ${isTeste ? html`<button class="btn btn-outline btn-sm" onClick=${limparTudo}>Limpar tudo</button>` : ''}
        </div>
      </div>
      ${CATEGORIAS.map((c) => html`<${CategoriaResultado} key=${c.id} categoria=${c} nomes=${nomes[c.id]} votos=${votos[c.id]} />`)}
    </div>
  `;
}

/* =========================================================
   PORTA DE VIDRO — login admin pra tela de resultado.
   É só um gate de UI: o código é público e as regras do
   Firebase são abertas, então isto barra curioso, não hacker.
   Guarda só o hash SHA-256 da senha, nunca a senha em texto.
   ========================================================= */
const ADMIN_USER = 'filipe-admin';
const ADMIN_HASH = 'ea859ee050229ba5df32cb4e232b6d33da37f3a61b0877d93154073627de646f';
const ADMIN_SS_KEY = 'overflowAdminOk';

async function sha256Hex(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function AdminGate({ children }) {
  const [ok, setOk] = useState(() => { try { return sessionStorage.getItem(ADMIN_SS_KEY) === '1'; } catch (e) { return false; } });
  const [user, setUser] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState('');
  const [checando, setChecando] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    setChecando(true);
    const hash = await sha256Hex(senha);
    if (user.trim().toLowerCase() === ADMIN_USER && hash === ADMIN_HASH) {
      try { sessionStorage.setItem(ADMIN_SS_KEY, '1'); } catch (_) {}
      setErro(''); setOk(true);
    } else {
      setErro('Usuário ou senha incorretos.');
    }
    setChecando(false);
  }
  function sair() {
    try { sessionStorage.removeItem(ADMIN_SS_KEY); } catch (_) {}
    setOk(false); setUser(''); setSenha(''); setErro('');
  }

  if (ok) return html`
    <div>
      <div class="admin-bar"><span class="admin-tag">🔓 admin</span><button class="btn btn-outline btn-sm" onClick=${sair}>Sair</button></div>
      ${children}
    </div>`;

  return html`
    <div class="login-wrap">
      <form class="login-card" onSubmit=${entrar}>
        <div class="login-title">Área restrita</div>
        <div class="login-sub">Resultado e administração · Overflow Awards</div>
        <input class="login-input" placeholder="usuário" value=${user} onInput=${(e) => setUser(e.target.value)} autocomplete="username" />
        <input class="login-input" type="password" placeholder="senha" value=${senha} onInput=${(e) => setSenha(e.target.value)} autocomplete="current-password" />
        ${erro ? html`<div class="login-erro">${erro}</div>` : ''}
        <button class="btn btn-primary btn-block" type="submit" disabled=${checando}>${checando ? 'Entrando…' : 'Entrar'}</button>
        <a class="login-back" href="?view=votar">← voltar pra votação</a>
      </form>
    </div>`;
}
